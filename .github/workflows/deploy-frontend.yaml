name: Build and push anyns-frontend image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NEXT_PUBLIC_* vars are inlined into the bundle by `next build`, so .env is needed at build time.
      # It is written outside the build context and passed as a BuildKit secret, so it never lands in the image.
      - name: Write .env for build
        run: echo "${{ secrets.ANYNS_FRONTEND_DOTENV }}" > "${{ runner.temp }}/anyns-frontend.env"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anyns-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            dotenv=${{ runner.temp }}/anyns-frontend.env
          cache-from: type=gha,scope=anyns-frontend
          cache-to: type=gha,mode=max,scope=anyns-frontend
